<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6 de Marzo — El Reto de los Logos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --dark: #1A1410;
      --cream: #FAF6EE;
      --success: #4CAF50;
      --error: #E05A6A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--dark);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      justify-content: center;
    }
    .game-container { text-align: center; }
    h1 { 
      font-family: 'Playfair Display', serif; 
      font-size: 2.5rem; 
      color: var(--gold); 
      margin-bottom: 1.5rem;
    }

    /* Área de Juego */
    .logo-row {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }
    .logo-option {
      flex: 1;
      max-width: 250px;
      aspect-ratio: 1/1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 1.5rem;
      transition: all 0.2s;
    }
    .logo-option:hover { border-color: var(--gold); transform: scale(1.03); }
    .logo-option img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }

    /* Contador Vertical */
    .timer-bar {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 12px;
      height: 150px;
    }
    .timer-seg {
      flex: 1;
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 3px;
      transition: all 0.3s;
    }
    .timer-seg.on { background: var(--gold); box-shadow: 0 0 10px var(--gold); }

    /* Puntos de Progreso */
    .progress { display: flex; gap: 8px; justify-content: center; margin-top: 2rem; }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(201,168,76,0.3);
    }
    .dot.active { background: var(--gold); border-color: var(--gold-light); }
    .dot.correct { background: var(--success); border-color: var(--success); }
    .dot.wrong { background: var(--error); border-color: var(--error); }

    @media (max-width: 600px) {
      .logo-row { gap: 0.8rem; }
      .logo-option { padding: 0.8rem; }
      .timer-bar { height: 100px; width: 8px; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="game-container">
    <h1>¿Cuál es el correcto?</h1>
    
    <div class="logo-row">
      <div class="logo-option" id="btn-A" onclick="checkAnswer('A')">
        <img id="img-A" src="" alt="Opción A">
      </div>

      <div class="timer-bar">
        <div id="t-3" class="timer-seg on"></div>
        <div id="t-2" class="timer-seg on"></div>
        <div id="t-1" class="timer-seg on"></div>
      </div>

      <div class="logo-option" id="btn-B" onclick="checkAnswer('B')">
        <img id="img-B" src="" alt="Opción B">
      </div>
    </div>

    <div class="progress" id="progress-bar"></div>
  </div>
</div>

<script>
  const logos = [
    { name: 'Apple', correct: 'A' },
    { name: 'BMW', correct: 'A' },
    { name: 'Chanel', correct: 'B' },
    { name: 'DominosPizza', correct: 'B' },
    { name: 'Google', correct: 'B' },
    { name: 'Instagram', correct: 'B' },
    { name: 'JuegosOlimpicos', correct: 'B' },
    { name: 'Microsoft', correct: 'A' },
    { name: 'Rolex', correct: 'A' },
    { name: 'Santander', correct: 'A' },
    { name: 'Tesla', correct: 'A' },
    { name: 'Tiktok', correct: 'A' }
  ];

  let currentIdx = 0;
  let timeLeft = 3;
  let timerInterval;

  // Crear puntos de progreso
  const progressContainer = document.getElementById('progress-bar');
  logos.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.id = `dot-${i}`;
    progressContainer.appendChild(d);
  });

  function loadPair() {
    if (currentIdx >= logos.length) {
      alert("¡Reto finalizado!");
      return;
    }
    
    const current = logos[currentIdx];
    document.getElementById('img-A').src = `../media/${current.name}_A.png`;
    document.getElementById('img-B').src = `../media/${current.name}_B.png`;
    
    resetTimer();
  }

  function resetTimer() {
    timeLeft = 3;
    updateTimerUI();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerUI();
      if (timeLeft === 0) {
        checkAnswer(null); // Falla por tiempo
      }
    }, 1000);
  }

  function updateTimerUI() {
    for (let i = 1; i <= 3; i++) {
      document.getElementById(`t-${i}`).classList.toggle('on', i <= timeLeft);
    }
  }

  function checkAnswer(choice) {
    clearInterval(timerInterval);
    const correct = logos[currentIdx].correct;
    const dot = document.getElementById(`dot-${currentIdx}`);
    
    dot.classList.remove('active');
    if (choice === correct) {
      dot.classList.add('correct');
    } else {
      dot.classList.add('wrong');
    }

    currentIdx++;
    if (currentIdx < logos.length) {
      document.getElementById(`dot-${currentIdx}`).classList.add('active');
      setTimeout(loadPair, 500); // Pequeña pausa antes del siguiente
    } else {
      // Aquí irá la lógica de fin de juego
      console.log("Juego terminado");
    }
  }

  // Controles de Teclado
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') checkAnswer('A');
    if (e.key === 'ArrowRight') checkAnswer('B');
  });

  // Controles Swipe (Móvil)
  let touchStartX = 0;
  window.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
  window.addEventListener('touchend', e => {
    let diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 50) {
      checkAnswer(diff > 0 ? 'B' : 'A');
    }
  });

  // Iniciar
  loadPair();
</script>

</body>
</html>
