<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6 de Marzo — 50 Aniversario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#8B6914;--cream:#FAF6EE;--dark:#1A1410;--success:#4CAF50;--error:#E05A6A;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background-color:var(--dark);color:var(--cream);font-family:'Cormorant Garamond',serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;touch-action: none;}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 25% 15%,rgba(201,168,76,.10) 0%,transparent 55%),radial-gradient(ellipse at 75% 85%,rgba(124,54,38,.10) 0%,transparent 55%);pointer-events:none;z-index:0;}
    
    .wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:2rem 1.5rem;flex:1;display:flex;flex-direction:column;width:100%;}
    .day-hero{text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
    
    .ornament-line-h{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1rem;}
    .o-line{height:1px;width:60px;background:linear-gradient(to right,transparent,var(--gold));}
    .o-line.r{background:linear-gradient(to left,transparent,var(--gold));}
    .o-dot{width:5px;height:5px;background:var(--gold);border-radius:50%;}
    
    .day-of-week{font-size:.85rem;letter-spacing:.4em;text-transform:uppercase;color:rgba(201,168,76,.5);margin-bottom:0.5rem;}
    h1{font-family:'Playfair Display',serif;font-size:clamp(2.5rem,7vw,5rem);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 50%,var(--gold-dark) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.2rem;}
    .month-label{font-family:'Playfair Display',serif;font-size:clamp(1.1rem,3vw,1.8rem);font-style:italic;color:rgba(250,246,238,.45);margin-bottom:1.5rem;}

    /* Game Area */
    .content-area{width:100%;display:flex;flex-direction:column;align-items:center;gap:1.5rem;padding:1rem 0;}
    
    .logo-row{display:flex;gap:1rem;width:100%;justify-content:center;align-items:center;max-height:40vh;}
    
    .logo-option{flex:1;max-width:280px;aspect-ratio:1/1;border:1px solid rgba(201,168,76,0.2);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform 0.2s, border-color 0.2s;background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;padding:1rem;}
    .logo-option:hover{transform:scale(1.02);border-color:var(--gold);}
    .logo-option img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;}

    /* Vertical Timer Bar */
    .timer-container{display:flex;flex-direction:column;gap:4px;width:10px;height:120px;}
    .timer-seg{flex:1;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);border-radius:2px;transition:background 0.3s;}
    .timer-seg.on{background:var(--gold);box-shadow:0 0 8px var(--gold);}

    /* Progress Dots */
    .progress-dots{display:flex;gap:0.6rem;justify-content:center;margin-top:1rem;}
    .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(201,168,76,0.2);transition:all 0.3s;}
    .dot.ambar{background:var(--gold);box-shadow:0 0 10px var(--gold);border-color:var(--gold-light);}
    .dot.verde{background:var(--success);box-shadow:0 0 10px var(--success);border-color:var(--success);}
    .dot.rojo{background:var(--error);box-shadow:0 0 10px var(--error);border-color:var(--error);}

    /* Nav & UI */
    .day-nav{display:flex;justify-content:space-between;align-items:center;padding-top:1.5rem;border-top:1px solid rgba(201,168,76,.1);margin-top:1.5rem;}
    .nav-btn{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(201,168,76,.5);text-decoration:none;padding:.5rem 1rem;border:1px solid rgba(201,168,76,.18);border-radius:2px;transition:all .2s;}
    .nav-btn:hover:not(.disabled){color:var(--gold-light);border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.05);}
    .nav-btn.disabled{opacity:0;pointer-events:none;}
    .year-badge{font-size:.65rem;letter-spacing:.3em;color:rgba(201,168,76,.25);text-transform:uppercase;}
    .back-link{display:block;text-align:center;margin-top:1.5rem;color:rgba(201,168,76,.35);font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;text-decoration:none;}

    .action-btns{position:absolute;top:0;right:0;display:flex;flex-direction:column;gap:.2rem;}
    .icon-btn{background:none;border:none;cursor:pointer;font-size:1.8rem;color:rgba(250,246,238,.2);transition:all .2s;}
    .icon-btn.active.fav-btn{color:#e05a6a;}
    .icon-btn.active.done-btn{color:var(--gold);opacity:1;}

    .popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:2rem;}
    .popup-overlay.visible{display:flex;}
    .popup-box{background:var(--dark);border:1px solid var(--gold);padding:2.5rem;max-width:400px;text-align:center;border-radius:4px;}
    .popup-btn{margin-top:1.5rem;padding:.7rem 2rem;background:none;border:1px solid var(--gold);color:var(--gold);cursor:pointer;text-transform:uppercase;letter-spacing:0.1em;}

    @media(max-width:600px){
      .logo-row{max-height: 35vh;}
      .logo-option{max-width:140px;}
      .timer-container{height: 80px; width: 6px;}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="day-hero">
    <div class="action-btns">
      <button class="icon-btn fav-btn" id="fav-btn" title="Favorito">♡</button>
      <button class="icon-btn done-btn" id="done-btn" title="Completado">☆</button>
    </div>
    <div class="ornament-line-h">
      <div class="o-line"></div><div class="o-dot"></div><div class="o-line r"></div>
    </div>
    <p class="day-of-week">Lunes</p>
    <h1>6</h1>
    <p class="month-label">de Marzo</p>

    <div class="content-area">
      <div class="logo-row">
        <div class="logo-option" id="opt-a" onclick="handleChoice('A')">
          <img src="../media/logo_01_a.png" alt="A" id="img-a">
        </div>
        
        <div class="timer-container">
          <div class="timer-seg on" id="t-3"></div>
          <div class="timer-seg on" id="t-2"></div>
          <div class="timer-seg on" id="t-1"></div>
        </div>

        <div class="logo-option" id="opt-b" onclick="handleChoice('B')">
          <img src="../media/logo_01_b.png" alt="B" id="img-b">
        </div>
      </div>
      
      <div class="progress-dots">
        <div class="dot ambar" id="dot-0"></div>
        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
        <div class="dot" id="dot-4"></div>
        <div class="dot" id="dot-5"></div>
        <div class="dot" id="dot-6"></div>
        <div class="dot" id="dot-7"></div>
        <div class="dot" id="dot-8"></div>
        <div class="dot" id="dot-9"></div>
      </div>
    </div>
  </div>

  <nav class="day-nav">
    <a class="nav-btn" href="2028-03-05.html">← 5 de Marzo</a>
    <span class="year-badge">50 Aniversario · 2028</span>
    <a class="nav-btn" id="next-btn" href="2028-03-07.html">7 de Marzo →</a>
  </nav>
  <a class="back-link" href="../index.html">← Volver al Calendario</a>
</div>

<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <div class="popup-icon" style="font-size:3rem">🎁</div>
    <p style="font-family:'Playfair Display'; font-size:1.5rem; color:var(--gold-light)">¡Paciencia!</p>
    <p style="margin-top:1rem; font-style:italic; opacity:0.7">Día bloqueado hasta su fecha.</p>
    <button class="popup-btn" onclick="window.location.href='../index.html'">Volver</button>
  </div>
</div>

<div class="popup-overlay" id="popup-star-reward">
  <div class="popup-box">
    <div class="popup-icon" style="font-size:3rem">🎁</div>
    <p style="font-family:'Playfair Display'; font-size:1.5rem; color:var(--gold-light)">¡Genial!</p>
    <p id="reward-text" style="margin-top:1rem; font-style:italic; opacity:0.7">PDTE</p>
    <button class="popup-btn" onclick="this.parentElement.parentElement.classList.remove('visible')">Cerrar</button>
  </div>
</div>

<script>
const PREVIEW_KEY = 'cal_preview';
const isPreview   = localStorage.getItem(PREVIEW_KEY) === '1';
const today       = new Date(); today.setHours(0,0,0,0);
const thisDate    = new Date('2028-03-06'); thisDate.setHours(0,0,0,0);

if (!isPreview && thisDate > today) {
  document.querySelector('.day-hero').style.filter = 'blur(4px)';
  document.querySelector('.day-nav').style.visibility = 'hidden';
  document.getElementById('popup').classList.add('visible');
}

// Game Logic
let currentStep = 0;
const totalSteps = 10;
const answers = ['A','B','A','B','A','B','A','B','A','B']; // Placeholder
let timeLeft = 3;
let timerId = null;

function startTimer() {
  timeLeft = 3;
  updateTimerUI();
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerId);
      handleChoice(null); // Timeout = Fail
    }
  }, 1000);
}

function updateTimerUI() {
  for(let i=1; i<=3; i++) {
    document.getElementById(`t-${i}`).classList.toggle('on', i <= timeLeft);
  }
}

function handleChoice(choice) {
  clearInterval(timerId);
  const dot = document.getElementById(`dot-${currentStep}`);
  const isCorrect = (choice === answers[currentStep]);
  
  dot.className = isCorrect ? 'dot verde' : 'dot rojo';
  currentStep++;

  if (currentStep < totalSteps) {
    document.getElementById(`dot-${currentStep}`).className = 'dot ambar';
    updateMedia();
    startTimer();
  } else {
    console.log("Fin");
  }
}

function updateMedia() {
  const step = String(currentStep + 1).padStart(2, '0');
  document.getElementById('img-a').src = `../media/logo_${step}_a.png`;
  document.getElementById('img-b').src = `../media/logo_${step}_b.png`;
}

// Controls: Keyboard
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') handleChoice('A');
  if (e.key === 'ArrowRight') handleChoice('B');
});

// Controls: Swipe
let touchStartX = 0;
window.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
window.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 50) {
    handleChoice(diff > 0 ? 'B' : 'A');
  }
});

// Init
startTimer();

// LocalStorage Boilers
const FAV_KEY = 'fav_2028-03-06';
const DONE_KEY = 'done_2028-03-06';
const fBtn = document.getElementById('fav-btn');
const dBtn = document.getElementById('done-btn');

function syncUI() {
  const f = localStorage.getItem(FAV_KEY) === '1';
  const d = localStorage.getItem(DONE_KEY) === '1';
  fBtn.textContent = f ? '❤' : '♡';
  fBtn.classList.toggle('active', f);
  dBtn.textContent = d ? '★' : '☆';
  dBtn.classList.toggle('active', d);
}

fBtn.addEventListener('click', () => {
  localStorage.getItem(FAV_KEY) === '1' ? localStorage.removeItem(FAV_KEY) : localStorage.setItem(FAV_KEY, '1');
  syncUI();
});

dBtn.addEventListener('click', () => {
  if (localStorage.getItem(DONE_KEY) === '1') {
    document.getElementById('popup-star-reward').classList.add('visible');
  } else if (isPreview) {
    localStorage.setItem(DONE_KEY, '1');
    syncUI();
  }
});

syncUI();
</script>
</body>
</html>
