<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6 de Marzo — El Reto de los Logos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dark: #8B6914;
      --cream: #FAF6EE;
      --dark: #1A1410;
      --success: #4CAF50;
      --error: #E05A6A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--dark);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }

    /* Fondo con degradado sutil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(201,168,76,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    header { text-align: center; margin-bottom: 3rem; }
    
    .date-label {
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1.1;
      background: linear-gradient(to bottom, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    /* Contenedor de Juego */
    .game-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .logo-card {
      flex: 1;
      max-width: 300px;
      aspect-ratio: 1/1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .logo-card:hover {
      border-color: var(--gold);
      background: rgba(201, 168, 76, 0.05);
      transform: translateY(-5px);
    }

    .logo-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
    }

    /* Temporizador de Lujo */
    .timer-rail {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 180px;
      width: 4px;
    }

    .timer-segment {
      flex: 1;
      background: rgba(201, 168, 76, 0.1);
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .timer-segment.active {
      background: var(--gold);
      box-shadow: 0 0 15px var(--gold);
    }

    /* Progreso Inferior */
    .footer-progress {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .dots-grid {
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid rgba(201, 168, 76, 0.3);
      transition: all 0.4s ease;
    }

    .dot.current { background: var(--gold); transform: scale(1.3); border-color: var(--gold-light); }
    .dot.correct { background: var(--success); border-color: var(--success); }
    .dot.wrong { background: var(--error); border-color: var(--error); }

    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      .game-area { gap: 1rem; }
      .logo-card { padding: 1rem; }
      .timer-rail { height: 120px; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="date-label">6 de Marzo</p>
    <h1>¿Cuál es el logo real?</h1>
  </header>

  <main class="game-area">
    <div class="logo-card" id="card-A" onclick="selectOption('A')">
      <img id="img-A" src="" alt="Opción A">
    </div>

    <div class="timer-rail">
      <div id="seg-3" class="timer-segment active"></div>
      <div id="seg-2" class="timer-segment active"></div>
      <div id="seg-1" class="timer-segment active"></div>
    </div>

    <div class="logo-card" id="card-B" onclick="selectOption('B')">
      <img id="img-B" src="" alt="Opción B">
    </div>
  </main>

  <footer class="footer-progress">
    <div class="dots-grid" id="dots-container"></div>
  </footer>
</div>

<script>
  const gameData = [
    { n: 'Apple', c: 'A' }, { n: 'BMW', c: 'A' }, { n: 'Chanel', c: 'B' },
    { n: 'DominosPizza', c: 'B' }, { n: 'Google', c: 'B' }, { n: 'Instagram', c: 'B' },
    { n: 'JuegosOlimpicos', c: 'B' }, { n: 'Microsoft', c: 'A' }, { n: 'Rolex', c: 'A' },
    { n: 'Santander', c: 'A' }, { n: 'Tesla', c: 'A' }, { n: 'Tiktok', c: 'A' }
  ];

  // Audios (Asegúrate de que existan en /media)
  const sndTick = new Audio('../media/tick.mp3');
  const sndCorrect = new Audio('../media/correct.mp3');
  const sndWrong = new Audio('../media/wrong.mp3');

  let currentStep = 0;
  let timeLeft = 3;
  let timerLoop;

  // Inicializar puntos de progreso
  const dotsContainer = document.getElementById('dots-container');
  gameData.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' current' : '');
    d.id = `dot-${i}`;
    dotsContainer.appendChild(d);
  });

  function loadChallenge() {
    if (currentStep >= gameData.length) {
      alert("¡Reto superado!");
      return;
    }

    const item = gameData[currentStep];
    document.getElementById('img-A').src = `../media/${item.n}_A.png`;
    document.getElementById('img-B').src = `../media/${item.n}_B.png`;
    
    startTimer();
  }

  function startTimer() {
    timeLeft = 3;
    updateTimerVisuals();
    clearInterval(timerLoop);
    
    timerLoop = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) sndTick.play().catch(()=>{});
      updateTimerVisuals();
      
      if (timeLeft <= 0) {
        clearInterval(timerLoop);
        selectOption(null); // Fallo por tiempo
      }
    }, 1000);
  }

  function updateTimerVisuals() {
    for (let i = 1; i <= 3; i++) {
      document.getElementById(`seg-${i}`).classList.toggle('active', i <= timeLeft);
    }
  }

  function selectOption(choice) {
    clearInterval(timerLoop);
    const correctChoice = gameData[currentStep].c;
    const dot = document.getElementById(`dot-${currentStep}`);
    
    dot.classList.remove('current');

    if (choice === correctChoice) {
      sndCorrect.play().catch(()=>{});
      dot.classList.add('correct');
    } else {
      sndWrong.play().catch(()=>{});
      dot.classList.add('wrong');
    }

    currentStep++;
    if (currentStep < gameData.length) {
      document.getElementById(`dot-${currentStep}`).classList.add('current');
      setTimeout(loadChallenge, 600);
    } else {
      // Fin del juego
      document.querySelector('h1').innerText = "Reto Completado";
    }
  }

  // Soporte para teclado
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') selectOption('A');
    if (e.key === 'ArrowRight') selectOption('B');
  });

  // Iniciar juego
  loadChallenge();
</script>

</body>
</html>
